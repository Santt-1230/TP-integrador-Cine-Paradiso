{% extends "base_admin.html" %}

{% block titulo %}Editar sala - Cine Paradiso{% endblock %}

{% block contenido_admin %}
<div class="formulario-admin">
    <p class="migas">Administración / Locales y salas / Editar sala</p>
    <h1>Editar sala {{ sala.numero_sala }}</h1>

    <form class="formulario-sala">
        <div class="campo-formulario">
            <label for="numero_sala">Número de sala</label>
            <input 
            type="number" id="numero_sala" name="numero_sala"
            min="1" value="{{ sala.numero_sala }}" required>
        </div>
        <div class="campo-formulario">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="activa" 
                    {% if sala.estado == 'activa' %}selected{% endif %}>
                    Activa
                </option>
                <option value="inactiva" {% if sala.estado == 'inactiva' %}
                selected{% endif %}>Inactiva
                </option>
            </select>
        </div>

        <div class="acciones-formulario">
            <button type="button">Cancelar</button>
            <button type="button">Guardar cambios</button>
        </div>
    </form>
</div>
{% endblock %}
