{% extends "base_admin.html" %}

{% block contenido_admin  %}
<div class="servicios-admin">

    <div class="servicios-admin__encabezado">
        <div>
            <p class="servicios-admin__migas">Administración / Servicios / Promociones</p>
            <h1>{{ 'Editar promoción' if promocion.id_promocion else 'Nueva promoción' }}</h1>
        </div>
    </div>

    {% if error %}
        <p class="servicios-admin__error">{{ error }}</p>
    {% endif %}

    <form method="post" class="formulario-admin">
        <div class="campo-formulario">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" name="nombre" value="{{ promocion.nombre or '' }}" required>
        </div>

        <div class="campo-formulario">
            <label for="descripcion">Descripción</label>
            <input id="descripcion" type="text" name="descripcion" value="{{ promocion.descripcion or '' }}">
        </div>

        <div class="campo-formulario">
            <label for="tipo">Tipo de promoción</label>
            <select id="tipo" name="tipo" required>
                <option value="">Seleccionar tipo</option>

                <option value="nxm" {% if promocion.get('tipo') == 'nxm' %}selected{% endif %}>
                    2x1 / N×M
                </option>

                <option value="porcentaje" {% if promocion.get('tipo') == 'porcentaje' %}selected{% endif %}>
                    Porcentaje
                </option>

                <option value="monto_fijo" {% if promocion.get('tipo') == 'monto_fijo' %}selected{% endif %}>
                    Monto fijo
                </option>
            </select>
        </div>

        <div id="campos-nxm" class="campo-formulario">
            <label for="cantidad_comprar">Cantidad a comprar</label>
            <input
                id="cantidad_comprar"
                type="number"
                name="cantidad_comprar"
                min="1"
                value="{{ promocion.get('cantidad_comprar') or '' }}">

            <label for="cantidad_pagar">Cantidad a pagar</label>
            <input
                id="cantidad_pagar"
                type="number"
                name="cantidad_pagar"
                min="1"
                value="{{ promocion.get('cantidad_pagar') or '' }}">
        </div>

        <div id="campos-porcentaje" class="campo-formulario">
            <label for="porcentaje">Porcentaje de descuento</label>
            <input
                id="porcentaje"
                type="number"
                name="porcentaje"
                min="0.01"
                max="100"
                step="0.01"
                value="{{ promocion.get('porcentaje') or '' }}">
        </div>

        <div id="campos-monto-fijo" class="campo-formulario">
            <label for="monto_descuento">Monto de descuento</label>
            <input
                id="monto_descuento"
                type="number"
                name="monto_descuento"
                min="0.01"
                step="0.01"
                value="{{ promocion.get('monto_descuento') or '' }}">
        </div>

        <div class="campo-formulario">
            <label for="imagen_url">Imagen URL</label>
            <input id="imagen_url" type="text" name="imagen_url" value="{{ promocion.imagen_url or '' }}">
        </div>

        <div class="campo-formulario">
            <label for="vigente_desde">Vigente desde</label>
            <input id="vigente_desde" type="date" name="vigente_desde" value="{{ promocion.vigente_desde or '' }}" required>
        </div>

        <div class="campo-formulario">
            <label for="vigente_hasta">Vigente hasta</label>
            <input id="vigente_hasta" type="date" name="vigente_hasta" value="{{ promocion.vigente_hasta or '' }}" required>
        </div>

        <label class="servicios-admin__check">
            <input type="checkbox" name="activa" {% if promocion.get('activa', True) %}checked{% endif %}>
            Activa
        </label>

        <div class="servicios-admin__pie-formulario">
            <a class="servicios-admin__accion" href="{{ url_for('servicios.admin_servicios') }}">Cancelar</a>
            <button type="submit" class="servicios-admin__boton">Guardar</button>
        </div>
    </form>
</div>
<script src="{{ url_for('static', filename='js/promociones.js') }}"></script>
{% endblock %}
