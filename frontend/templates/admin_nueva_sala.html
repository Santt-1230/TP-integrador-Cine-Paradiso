{% extends "base_admin.html" %}

{% block titulo %}Agregar sala - Cine Paradiso{% endblock %}

{% block contenido_admin %}
<div class="formulario-admin">
    <p class="migas">Administración / Locales y salas / Editar sala</p>
    <h1>Editar sala {{ id_sala }}</h1>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('salas.editar_sala', id_sala=id_sala) }}" class="formulario-sala">
        <div class="campo-formulario">
            <label for="numero_sala">Número de sala</label>
            <input 
            type="number" id="numero_sala" name="numero_sala"
            min="1" value="{{ datos.numero_sala }}" required>
        </div>
        <div class="campo-formulario">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="activa" 
                    {% if datos.estado == 'activa' %}selected{% endif %}>
                    Activa
                </option>
                <option value="inactiva" {% if datos.estado == 'inactiva' %}
                selected{% endif %}>Inactiva
                </option>
            </select>
        </div>

        <div class="acciones-formulario">
            <a class="boton-agregar" href="{{ url_for('locales.admin_locales')}}">Cancelar</a>
            <button type="submit" class="boton-agregar">Guardar cambios</button>
        </div>
    </form>
</div>
{% endblock %}
